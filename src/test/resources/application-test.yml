spring:
  datasource:
    url: jdbc:h2:mem:newproiect;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      connect-timeout: 200ms

management:
  health:
    redis:
      enabled: false

app:
  cache:
    user-enabled: false
  thread-pool:
    user-batch:
      core-size: 2
      max-size: 4
      queue-capacity: 10
      keep-alive: 10s
      task-timeout: 1s

logging:
  level:
    com.example.newproiect: warn

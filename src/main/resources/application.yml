spring:
  application:
    name: newproiect
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/newproiect?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: ${SERVER_PORT:8080}

app:
  cache:
    user-enabled: ${USER_CACHE_ENABLED:true}
    user-ttl: ${USER_CACHE_TTL:30m}
  thread-pool:
    user-batch:
      # 平时保留的线程数量
      core-size: ${USER_BATCH_CORE_SIZE:4}
      # 任务很多时最多创建的线程数量
      max-size: ${USER_BATCH_MAX_SIZE:8}
      # 线程都忙时，最多排队多少个任务
      queue-capacity: ${USER_BATCH_QUEUE_CAPACITY:100}
      # 空闲线程保留多久
      keep-alive: ${USER_BATCH_KEEP_ALIVE:60s}
      # 主线程等待单个任务结果的最长时间
      task-timeout: ${USER_BATCH_TASK_TIMEOUT:5s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.newproiect: info
